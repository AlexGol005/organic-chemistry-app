<!-- === МОБИЛЬНОЕ ПРИЛОЖЕНИЕ === -->
<!DOCTYPE html>
<html>
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0, maximum-scale=1.0, user-scalable=no">
    <title>JSME Mobile Editor</title>
    <!-- Подключаем сам скрипт JSME, который будет лежать в этой же папке -->
    <script type="text/javascript" src="jsme.nocache.js"></script>
    
    <style>
        body, html {
            margin: 0;
            padding: 0;
            width: 100%;
            height: 100%;
            overflow: hidden;
            background-color: #ffffff;
        }
        #jsme_container {
            width: 100%;
            height: 100%;
        }
    </style>

    <script type="text/javascript">
        var jsmeApplet;

        // Эта функция автоматически вызывается, когда JSME готов к работе
        function jsmeOnLoad() {
            // Инициализируем редактор на весь экран смартфона
            jsmeApplet = new JSME.JSME("jsme_container", {
                "options": "query,nohydrogens,reaction,multipart",
                "guicolor": "#f5f5f5"
            });
        }

        // Функция, которую мобильное приложение будет вызывать, чтобы ЗАБРАТЬ SMILES
        function getSmilesFromEditor() {
            if (jsmeApplet) {
                var smiles = jsmeApplet.smiles();
                // Отправляем строку SMILES обратно во Flutter-код приложения
                if (window.FlutterChannel) {
                    window.FlutterChannel.postMessage(smiles);
                }
            }
        }

        // Функция, которую мобильное приложение вызовет, если нужно ОТРЕСОВАТЬ молекулу (режим mol_to_name)
        function setSmilesToEditor(smilesString) {
            if (jsmeApplet && smilesString) {
                jsmeApplet.readGenericMolecularInput(smilesString);
            }
        }
    </script>
</head>
<body>
    <div id="jsme_container"></div>
</body>
</html>
<!-- === КОНЕЦ БЛОКА МОБИЛЬНОЕ ПРИЛОЖЕНИЕ === -->
